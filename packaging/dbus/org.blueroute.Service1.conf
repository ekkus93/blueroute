<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    P5-006 needs only service-name ownership so the root-run system daemon can
    acquire org.blueroute.Service1. Caller/method authorization belongs to
    P5-007 and must not be broadened here.
  -->
  <policy user="root">
    <allow own="org.blueroute.Service1"/>
  </policy>
</busconfig>
