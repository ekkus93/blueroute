<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the privileged system daemon may own the well-known service name. -->
  <policy user="root">
    <allow own="org.blueroute.Service1"/>
  </policy>

  <!--
    Local unprivileged clients may send requests to BlueRoute. Read-only methods
    are intentionally inspectable without privilege. Mutating Request commands
    are authorized inside the daemon through PolicyKit before dispatch.
  -->
  <policy context="default">
    <allow send_destination="org.blueroute.Service1"/>
  </policy>
</busconfig>
