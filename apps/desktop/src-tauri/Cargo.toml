[package]
name = "blueroute-desktop-app"
description = "BlueRoute Tauri 2 desktop application shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
blueroute-desktop = { path = ".." }
blueroute-protocol = { path = "../../../crates/blueroute-protocol" }
tauri = { version = "=2.12.5", features = [] }

[features]
# Release builds serve the embedded frontend (ui/dist) instead of the dev server URL.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
