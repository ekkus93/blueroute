name: P4-007 closeout

on:
  push:
    branches:
      - P4-007_networkmanager_backend
    paths:
      - .github/workflows/p4-007-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-007_networkmanager_backend
      - name: Reconcile P4-007 documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          todo = Path('docs/TODO.md')
          text = todo.read_text()
          text = text.replace('**Status date:** 2026-08-31', '**Status date:** 2026-09-01', 1)

          p4_006_row = '| P4-006 | `[x]` | BlueZ NetworkServer1 NAP registration, client attach/detach observation, ownership-aware idempotent cleanup, typed capability failures, and real two-node Rust NAP/PANU data-plane hardware acceptance are complete. |'
          p4_007_row = '| P4-007 | `[x]` | Direct NetworkManager system-D-Bus backend, bounded state observation, explicit ownership, BlueRoute-owned bridge/address lifecycle, fail-closed cross-owner handling, and real Debian 13 hardware acceptance are complete. |'
          if p4_007_row not in text:
              if text.count(p4_006_row) != 1:
                  raise SystemExit('expected exactly one P4-006 status row')
              text = text.replace(p4_006_row, p4_006_row + '\n' + p4_007_row, 1)

          old = '''## P4-007 — Implement NetworkManager backend

- [ ] enumerate relevant connections/devices.
- [ ] observe changes.
- [ ] apply BlueRoute-owned addressing.
- [ ] remove only BlueRoute-owned state.

**Acceptance**

- No production operation parses `nmcli` output.'''
          new = '''## P4-007 — Implement NetworkManager backend

- [x] enumerate relevant connections/devices.
- [x] observe changes.
- [x] apply BlueRoute-owned addressing.
- [x] remove only BlueRoute-owned state.

**Acceptance**

- No production operation parses `nmcli` output.
- Hardware acceptance is recorded in `docs/P4-007-HARDWARE-EVIDENCE-2026-09-01.md`; the Rust NetworkManager backend on `debiancb1` enumerated live state, observed bridge/profile events, applied `10.254.89.1/30`, rejected cross-owner takeover without leaking state, completed repeated idempotent cleanup, and preserved all 15 baseline foreign NetworkManager profiles.
- Implementation/design notes and the hardware probe are documented in `docs/P4-007-NETWORKMANAGER.md`.'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one incomplete P4-007 block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          todo.write_text(text)

          doc = Path('docs/P4-007-NETWORKMANAGER.md')
          text = doc.read_text()
          old = '''## Acceptance evidence

P4-007 remains in progress until the live NetworkManager probe is run on the physical Debian test node and the evidence is recorded in a dedicated hardware-evidence document. CI proves compilation/unit behavior; it does not prove NetworkManager/Polkit/kernel application behavior on the target host.'''
          new = '''## Acceptance evidence

Physical acceptance is recorded in `docs/P4-007-HARDWARE-EVIDENCE-2026-09-01.md`. On `debiancb1` (Debian 13, kernel `6.12.86+deb13-amd64`, BlueZ 5.82, NetworkManager 1.52.1), the Rust probe created and observed `br-blue-nm`, applied `10.254.89.1/30`, proved idempotent ensure/remove behavior, rejected a second BlueRoute owner without leaking a profile, treated wrong-owner cleanup as a no-op, and preserved all 15 baseline foreign NetworkManager profiles. The accepted run ended with `P4-007 NetworkManager probe PASS`.'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one pending acceptance paragraph, found {text.count(old)}')
          text = text.replace(old, new, 1)
          doc.write_text(text)
          PY
          rm .github/workflows/p4-007-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: close P4-007 acceptance'
          git push origin HEAD:P4-007_networkmanager_backend
