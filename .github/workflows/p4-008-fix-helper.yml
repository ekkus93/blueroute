name: Fix P4-008 patch helper

on:
  push:
    branches:
      - P4-008_route_adapter
    paths:
      - .github/workflows/p4-008-fix-helper.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-008_route_adapter
      - name: Fix exact-match template and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/p4-008-route-patch.yml')
          text = path.read_text()
          start = text.index("          old = '''    fn routes")
          end = text.index("          new = '''", start)
          block = text[start:end]
          lines = block.splitlines()
          if len(lines) < 2:
              raise SystemExit('unexpected route template block')
          fixed = '\n'.join([lines[0], *['    ' + line for line in lines[1:]]]) + '\n'
          text = text[:start] + fixed + text[end:]
          path.write_text(text)
          PY
          rm .github/workflows/p4-008-fix-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: correct P4-008 route patch template'
          git push origin HEAD:P4-008_route_adapter
