name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  close-task:
    name: Close P5-001 and P5-005
    runs-on: ubuntu-latest
    steps:
      - name: Check out P5-005 branch
        uses: actions/checkout@v4
        with:
          ref: P5-005_blueroute_client

      - name: Update task metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/TODO.md")
          text = path.read_text()

          replacements = {
              "| P5-001 | `[-]` | API version contract and compatibility rules are implemented/tested; client-side incompatibility enforcement remains pending P5-005. |":
                  "| P5-001 | `[x]` | Versioned local API contract and real-broker client enforcement are complete; incompatible daemon replacement is rejected before normal commands. |",
              "| P5-004 | `[x]` | Versioned daemon D-Bus service ownership, status/capability queries, fail-closed request decoding, typed event signaling, and real broker-level CI acceptance are complete. |\n| All other tasks | `[ ]` | Not started. |":
                  "| P5-004 | `[x]` | Versioned daemon D-Bus service ownership, status/capability queries, fail-closed request decoding, typed event signaling, and real broker-level CI acceptance are complete. |\n| P5-005 | `[x]` | Shared system-D-Bus client, mandatory version gating, typed requests/events, bounded reconnect, and real-broker restart/incompatibility acceptance are complete. |\n| All other tasks | `[ ]` | Not started. |",
              "- Client detects incompatibility before normal commands.\n\n## P5-002":
                  "- Client detects incompatibility before normal commands.\n- Real-broker incompatibility enforcement is recorded in `docs/P5-005-CLIENT.md`; an incompatible replacement daemon was rejected with zero calls to its normal `Request` method.\n\n## P5-002",
              "- [ ] connect.\n- [ ] version negotiation.\n- [ ] typed requests.\n- [ ] events.\n- [ ] reconnect after daemon restart.":
                  "- [x] connect.\n- [x] version negotiation.\n- [x] typed requests.\n- [x] events.\n- [x] reconnect after daemon restart.",
              "- CLI/TUI/Tauri share the crate with no duplicate system-D-Bus networking logic.\n\n## P5-006":
                  "- CLI/TUI/Tauri share the crate with no duplicate system-D-Bus networking logic.\n- Client design, non-replay reconnect semantics, and real-broker acceptance are documented in `docs/P5-005-CLIENT.md`.\n\n## P5-006",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one TODO match, found {count}: {old!r}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Commit TODO closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO.md
          if git diff --cached --quiet; then
            echo "No TODO changes to commit"
          else
            git commit -m "docs: close P5-001 and P5-005 acceptance"
            git push origin HEAD:P5-005_blueroute_client
          fi
