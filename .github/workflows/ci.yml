name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run daemon D-Bus integration test
        run: dbus-run-session -- cargo test -p blueroute-daemon --test dbus_service --locked dbus_service_round_trip_and_event -- --ignored --exact

      - name: Run daemon authorization integration test
        run: dbus-run-session -- cargo test -p blueroute-daemon --test authorization --locked authorization_is_read_only_by_default_and_polkit_gates_mutations -- --ignored --exact

      - name: Run client D-Bus integration test
        run: dbus-run-session -- cargo test -p blueroute-client --test dbus_client --locked client_queries_events_reconnects_and_fails_closed_on_incompatibility -- --ignored --exact

      - name: Validate systemd service
        run: |
          sudo install -Dm0755 /bin/true /usr/libexec/blueroute/blueroute-daemon
          stub_dir="$(mktemp -d)"
          trap 'rm -rf "$stub_dir"' EXIT
          for unit in bluetooth.service NetworkManager.service; do
            printf '[Unit]\nDescription=CI dependency stub\n[Service]\nType=oneshot\nExecStart=/bin/true\n' > "$stub_dir/$unit"
          done
          SYSTEMD_UNIT_PATH="$PWD/packaging/systemd:$stub_dir:/usr/lib/systemd/system:/lib/systemd/system" \
            systemd-analyze verify blueroute.service
          grep -Fxq 'Type=dbus' packaging/systemd/blueroute.service
          grep -Fxq 'BusName=org.blueroute.Service1' packaging/systemd/blueroute.service
          grep -Fxq 'Restart=on-failure' packaging/systemd/blueroute.service
          grep -Fxq 'StandardOutput=journal' packaging/systemd/blueroute.service
          grep -Fxq 'StandardError=journal' packaging/systemd/blueroute.service
          grep -Fxq 'WantedBy=multi-user.target' packaging/systemd/blueroute.service

      - name: Validate D-Bus and PolicyKit authorization packaging
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          bus_root = ET.parse(Path("packaging/dbus/org.blueroute.Service1.conf")).getroot()
          policies = bus_root.findall("policy")
          assert len(policies) == 2
          root_policy = next(p for p in policies if p.attrib == {"user": "root"})
          default_policy = next(p for p in policies if p.attrib == {"context": "default"})
          assert [child.attrib for child in root_policy] == [{"own": "org.blueroute.Service1"}]
          assert [child.attrib for child in default_policy] == [
              {"send_destination": "org.blueroute.Service1"}
          ]

          polkit_root = ET.parse(Path("packaging/polkit/org.blueroute.policy")).getroot()
          actions = {action.attrib["id"]: action for action in polkit_root.findall("action")}
          assert set(actions) == {
              "org.blueroute.modify",
              "org.blueroute.internet-sharing",
          }
          for action in actions.values():
              defaults = action.find("defaults")
              assert defaults is not None
              assert defaults.findtext("allow_any") == "no"
              assert defaults.findtext("allow_inactive") == "auth_admin"
              assert defaults.findtext("allow_active") == "auth_admin_keep"
          PY

      - name: Close P6-001 TODO after accepted hardware evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'P6-001_create_network'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/TODO.md")
          text = path.read_text()

          status_anchor = "| P5-007 | `[x]` | Least-privilege D-Bus/PolicyKit authorization is implemented and live Debian acceptance proves unprivileged read-only inspection plus fail-closed unauthorized mutation denial. |\n| All other tasks | `[ ]` | Not started. |"
          status_replacement = "| P5-007 | `[x]` | Least-privilege D-Bus/PolicyKit authorization is implemented and live Debian acceptance proves unprivileged read-only inspection plus fail-closed unauthorized mutation denial. |\n| P6-001 | `[x]` | CreateNetwork now establishes durable member state, a deterministic BlueRoute-owned NetworkManager bridge/address, a live BlueZ NAP, and real PANU attachment on physical hardware. |\n| All other tasks | `[ ]` | Not started. |"
          if status_anchor in text:
              text = text.replace(status_anchor, status_replacement, 1)
          elif "| P6-001 | `[x]` |" not in text:
              raise SystemExit("P6-001 status-table anchor not found")

          old = """## P6-001 — Implement create-network operation

- [ ] create logical network ID/name.
- [ ] persist membership.
- [ ] select local NAP only if capability permits.
- [ ] establish local subnet.

**Acceptance**

- `CreateNetwork` yields stable daemon state on a NAP-capable Linux node.
- Unsupported NAP capability produces a clear error rather than a model-name special case.
"""
          new = """## P6-001 — Implement create-network operation

- [x] create logical network ID/name.
- [x] persist membership.
- [x] select local NAP only if capability permits.
- [x] establish local subnet.

**Acceptance**

- `CreateNetwork` yields stable daemon state on a NAP-capable Linux node.
- Unsupported NAP capability produces a clear error rather than a model-name special case.
- Hardware acceptance is recorded in `docs/P6-001-HARDWARE-EVIDENCE-2026-09-01.md`; the production daemon created network `26ed3f29d622ae9c5c68635f4d548bbe`, persisted stable member state, created `brb-26ed3f29` with `10.201.41.1/24`, registered a live NAP, and accepted `arisu` so the server-side Bluetooth interface `enxf4d10870b786` became a kernel member of that exact bridge.
"""
          if old in text:
              text = text.replace(old, new, 1)
          elif "- [x] create logical network ID/name." not in text:
              raise SystemExit("P6-001 task block anchor not found")

          path.write_text(text)
          PY

          if git diff --quiet -- docs/TODO.md; then
            echo 'P6-001 TODO already closed; no commit needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TODO.md
          git commit -m 'docs: close P6-001 hardware acceptance'
          git push origin HEAD:${GITHUB_HEAD_REF}
