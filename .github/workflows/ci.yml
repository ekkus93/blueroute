name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run daemon D-Bus integration test
        run: dbus-run-session -- cargo test -p blueroute-daemon --test dbus_service --locked dbus_service_round_trip_and_event -- --ignored --exact

      - name: Run client D-Bus integration test
        run: dbus-run-session -- cargo test -p blueroute-client --test dbus_client --locked client_queries_events_reconnects_and_fails_closed_on_incompatibility -- --ignored --exact

      - name: Validate systemd service
        run: |
          sudo install -Dm0755 /bin/true /usr/libexec/blueroute/blueroute-daemon
          stub_dir="$(mktemp -d)"
          trap 'rm -rf "$stub_dir"' EXIT
          for unit in bluetooth.service NetworkManager.service; do
            printf '[Unit]\nDescription=CI dependency stub\n[Service]\nType=oneshot\nExecStart=/bin/true\n' > "$stub_dir/$unit"
          done
          SYSTEMD_UNIT_PATH="$PWD/packaging/systemd:$stub_dir:/usr/lib/systemd/system:/lib/systemd/system" systemd-analyze verify blueroute.service
          grep -Fxq 'Type=dbus' packaging/systemd/blueroute.service
          grep -Fxq 'BusName=org.blueroute.Service1' packaging/systemd/blueroute.service
          grep -Fxq 'Restart=on-failure' packaging/systemd/blueroute.service
          grep -Fxq 'StandardOutput=journal' packaging/systemd/blueroute.service
          grep -Fxq 'StandardError=journal' packaging/systemd/blueroute.service
          grep -Fxq 'WantedBy=multi-user.target' packaging/systemd/blueroute.service

      - name: Validate D-Bus service ownership policy
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("packaging/dbus/org.blueroute.Service1.conf")
          root = ET.parse(path).getroot()
          policies = root.findall("policy")
          assert len(policies) == 1
          policy = policies[0]
          assert policy.attrib == {"user": "root"}
          children = list(policy)
          assert len(children) == 1
          allow = children[0]
          assert allow.tag == "allow"
          assert allow.attrib == {"own": "org.blueroute.Service1"}
          PY

      - name: Close P5-006 after hardware acceptance
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin P5-006_systemd_service
          git switch -C P5-006_systemd_service origin/P5-006_systemd_service
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/TODO.md")
          text = path.read_text()
          anchor = "| P5-005 | `[x]` | Shared system-D-Bus client, mandatory version gating, typed requests/events, bounded reconnect, and real-broker restart/incompatibility acceptance are complete. |\n| All other tasks | `[ ]` | Not started. |"
          replacement = "| P5-005 | `[x]` | Shared system-D-Bus client, mandatory version gating, typed requests/events, bounded reconnect, and real-broker restart/incompatibility acceptance are complete. |\n| P5-006 | `[x]` | System-level systemd service packaging, D-Bus name ownership, bounded restart policy, journald integration, boot activation, and GUI-logout independence are proven on Debian 13 hardware. |\n| All other tasks | `[ ]` | Not started. |"
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement)
          old_lines = ["## P5-006 — Add systemd service", "", "- [ ] unit file.", "- [ ] restart policy.", "- [ ] startup ordering.", "- [ ] journald logging.", "", "**Acceptance**", "", "- Daemon starts at boot on supported Debian baseline and survives GUI logout."]
          new_lines = ["## P5-006 — Add systemd service", "", "- [x] unit file.", "- [x] restart policy.", "- [x] startup ordering.", "- [x] journald logging.", "", "**Acceptance**", "", "- Daemon starts at boot on supported Debian baseline and survives GUI logout.", "- Hardware acceptance is recorded in `docs/P5-006-HARDWARE-EVIDENCE-2026-09-01.md`; the enabled system service started automatically after reboot, survived GUI logout/login with the same PID and InvocationID, restarted after forced `SIGKILL`, and retained restrictive systemd-managed state/runtime directories."]
          old = "\n".join(old_lines)
          new = "\n".join(new_lines)
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TODO.md
          git diff --cached --check
          git commit -m 'docs: close P5-006 after hardware acceptance'
          git push origin HEAD:P5-006_systemd_service
