name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare P5-005
    runs-on: ubuntu-latest
    steps:
      - name: Check out P5-005 branch
        uses: actions/checkout@v4
        with:
          ref: P5-005_blueroute_client

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0

      - name: Refresh lockfile, compile all targets, and format
        run: |
          cargo check --workspace --all-targets
          cargo fmt --all

      - name: Commit generated source and lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/blueroute-client
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore: prepare P5-005 generated state"
            git push origin HEAD:P5-005_blueroute_client
          fi
