name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: P5-007_dbus_polkit_authorization

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run daemon D-Bus integration test
        run: dbus-run-session -- cargo test -p blueroute-daemon --test dbus_service --locked dbus_service_round_trip_and_event -- --ignored --exact

      - name: Run daemon authorization integration test
        run: dbus-run-session -- cargo test -p blueroute-daemon --test authorization --locked authorization_is_read_only_by_default_and_polkit_gates_mutations -- --ignored --exact

      - name: Run client D-Bus integration test
        run: dbus-run-session -- cargo test -p blueroute-client --test dbus_client --locked client_queries_events_reconnects_and_fails_closed_on_incompatibility -- --ignored --exact

      - name: Validate systemd service
        run: |
          sudo install -Dm0755 /bin/true /usr/libexec/blueroute/blueroute-daemon
          stub_dir="$(mktemp -d)"
          trap 'rm -rf "$stub_dir"' EXIT
          for unit in bluetooth.service NetworkManager.service; do
            printf '[Unit]\nDescription=CI dependency stub\n[Service]\nType=oneshot\nExecStart=/bin/true\n' > "$stub_dir/$unit"
          done
          SYSTEMD_UNIT_PATH="$PWD/packaging/systemd:$stub_dir:/usr/lib/systemd/system:/lib/systemd/system" \
            systemd-analyze verify blueroute.service
          grep -Fxq 'Type=dbus' packaging/systemd/blueroute.service
          grep -Fxq 'BusName=org.blueroute.Service1' packaging/systemd/blueroute.service
          grep -Fxq 'Restart=on-failure' packaging/systemd/blueroute.service
          grep -Fxq 'StandardOutput=journal' packaging/systemd/blueroute.service
          grep -Fxq 'StandardError=journal' packaging/systemd/blueroute.service
          grep -Fxq 'WantedBy=multi-user.target' packaging/systemd/blueroute.service

      - name: Validate D-Bus and PolicyKit authorization packaging
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          bus_root = ET.parse(Path("packaging/dbus/org.blueroute.Service1.conf")).getroot()
          policies = bus_root.findall("policy")
          assert len(policies) == 2
          root_policy = next(p for p in policies if p.attrib == {"user": "root"})
          default_policy = next(p for p in policies if p.attrib == {"context": "default"})
          assert [child.attrib for child in root_policy] == [{"own": "org.blueroute.Service1"}]
          assert [child.attrib for child in default_policy] == [
              {"send_destination": "org.blueroute.Service1"}
          ]

          polkit_root = ET.parse(Path("packaging/polkit/org.blueroute.policy")).getroot()
          actions = {action.attrib["id"]: action for action in polkit_root.findall("action")}
          assert set(actions) == {
              "org.blueroute.modify",
              "org.blueroute.internet-sharing",
          }
          for action in actions.values():
              defaults = action.find("defaults")
              assert defaults is not None
              assert defaults.findtext("allow_any") == "no"
              assert defaults.findtext("allow_inactive") == "auth_admin"
              assert defaults.findtext("allow_active") == "auth_admin_keep"
          PY

      - name: Close P5-007 TODO
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/TODO.md")
          text = path.read_text()

          old_status = "| P5-006 | `[x]` | System-level systemd service packaging, D-Bus name ownership, bounded restart policy, journald integration, boot activation, and GUI-logout independence are proven on Debian 13 hardware. |\n| All other tasks | `[ ]` | Not started. |"
          new_status = "| P5-006 | `[x]` | System-level systemd service packaging, D-Bus name ownership, bounded restart policy, journald integration, boot activation, and GUI-logout independence are proven on Debian 13 hardware. |\n| P5-007 | `[x]` | Least-privilege D-Bus/PolicyKit authorization is implemented and live Debian acceptance proves unprivileged read-only inspection plus fail-closed unauthorized mutation denial. |\n| All other tasks | `[ ]` | Not started. |"

          old_task = "## P5-007 — Define D-Bus/Polkit authorization policy\n\n- [ ] read-only vs mutating operations.\n- [ ] authorization behavior.\n- [ ] no blanket front-end root access.\n\n**Acceptance**\n\n- Intended users can inspect status; unauthorized sensitive changes fail safely."
          new_task = "## P5-007 — Define D-Bus/Polkit authorization policy\n\n- [x] read-only vs mutating operations.\n- [x] authorization behavior.\n- [x] no blanket front-end root access.\n\n**Acceptance**\n\n- Intended users can inspect status; unauthorized sensitive changes fail safely.\n- Hardware acceptance is recorded in `docs/P5-007-HARDWARE-EVIDENCE-2026-09-01.md`; the normal Debian user read version/status without elevation, an unprivileged `nobody` mutation was denied before dispatch with a nonzero D-Bus call result, and the daemon remained active."

          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          elif new_status not in text:
              raise SystemExit("P5-007 status-table guard did not match")

          if old_task in text:
              text = text.replace(old_task, new_task, 1)
          elif new_task not in text:
              raise SystemExit("P5-007 task-block guard did not match")

          path.write_text(text)
          PY

          if git diff --quiet -- docs/TODO.md; then
            echo 'P5-007 TODO already closed; nothing to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TODO.md
          git commit -m 'docs: close P5-007 authorization task'
          git push origin HEAD:P5-007_dbus_polkit_authorization
