name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  close-task:
    name: Close P5-004
    runs-on: ubuntu-latest
    steps:
      - name: Check out P5-004 branch
        uses: actions/checkout@v4
        with:
          ref: P5-004_daemon_dbus_service

      - name: Update task metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/TODO.md")
          text = path.read_text()

          replacements = {
              "| P5-003 | `[x]` | Event model and deterministic structural tests are implemented and green in CI. |\n| All other tasks | `[ ]` | Not started. |":
                  "| P5-003 | `[x]` | Event model and deterministic structural tests are implemented and green in CI. |\n| P5-004 | `[x]` | Versioned daemon D-Bus service ownership, status/capability queries, fail-closed request decoding, typed event signaling, and real broker-level CI acceptance are complete. |\n| All other tasks | `[ ]` | Not started. |",
              "- [ ] own service name.\n- [ ] expose version/status/capabilities.\n- [ ] emit test event.\n- [ ] reject malformed requests safely.":
                  "- [x] own service name.\n- [x] expose version/status/capabilities.\n- [x] emit test event.\n- [x] reject malformed requests safely.",
              "- Test client queries daemon and receives events.\n\n## P5-005":
                  "- Test client queries daemon and receives events.\n- Service design, fail-closed behavior, and real-broker acceptance are documented in `docs/P5-004-DBUS-SERVICE.md`.\n\n## P5-005",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one TODO match, found {count}: {old!r}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Commit TODO closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO.md
          if git diff --cached --quiet; then
            echo "No TODO changes to commit"
          else
            git commit -m "docs: close P5-004 acceptance"
            git push origin HEAD:P5-004_daemon_dbus_service
          fi
