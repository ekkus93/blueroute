name: P4-007 prefix conversion fix

on:
  push:
    branches:
      - P4-007_networkmanager_backend
    paths:
      - .github/workflows/p4-007-prefix-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-007_networkmanager_backend
          fetch-depth: 2
      - name: Patch prefix conversion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/blueroute-linux/src/networkmanager.rs')
          text = path.read_text()
          old = '''            let prefix: u32 = entry\n                .get("prefix")\n                .ok_or_else(|| {\n                    CoreError::new(\n                        ErrorKind::ProtocolError,\n                        "NetworkManager address-data entry is missing a prefix",\n                    )\n                })?\n                .clone()\n                .try_into()\n                .map_err(|error| {\n                    CoreError::with_diagnostic(\n                        ErrorKind::ProtocolError,\n                        "NetworkManager returned an invalid address prefix",\n                        error.to_string(),\n                    )\n                })?;'''
          new = '''            let prefix = u32::try_from(\n                entry\n                    .get("prefix")\n                    .ok_or_else(|| {\n                        CoreError::new(\n                            ErrorKind::ProtocolError,\n                            "NetworkManager address-data entry is missing a prefix",\n                        )\n                    })?\n                    .clone(),\n            )\n            .map_err(|error| {\n                CoreError::with_diagnostic(\n                    ErrorKind::ProtocolError,\n                    "NetworkManager returned an invalid address prefix",\n                    error.to_string(),\n                )\n            })?;'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one prefix conversion target, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0
          cargo fmt --all
          rm .github/workflows/p4-007-prefix-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: type NetworkManager address prefix conversion'
          git push origin HEAD:P4-007_networkmanager_backend
