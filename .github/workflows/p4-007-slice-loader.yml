name: P4-007 slice loader

on:
  push:
    branches:
      - P4-007_networkmanager_backend

permissions:
  contents: write

jobs:
  load-slice:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-007_networkmanager_backend
      - name: Install verified implementation slice
        shell: bash
        run: |
          set -euo pipefail
          cat .p4-007-slice-part-* > /tmp/p4-007-slice.b64
          base64 --decode /tmp/p4-007-slice.b64 > /tmp/p4-007-slice.tgz
          test "$(sha256sum /tmp/p4-007-slice.tgz | awk '{print $1}')" = "49a6c3da41354b38c2ae01bb576472b2064fe3574d52f2a27b027a1c1b25522b"
          tar -xzf /tmp/p4-007-slice.tgz
          rm .p4-007-slice-part-*
          rm .github/workflows/p4-007-slice-loader.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add NetworkManager backend foundation'
          git push origin HEAD:P4-007_networkmanager_backend
