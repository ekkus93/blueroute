name: P4-007 slice loader

on:
  push:
    branches:
      - P4-007_networkmanager_backend

permissions:
  contents: write

jobs:
  load-slice:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-007_networkmanager_backend
          fetch-depth: 2
      - name: Install implementation slice
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/p4-007-slice-loader.yml \
            | sed -n '/^H4sIA/,/^PAYLOAD$/p' \
            | sed '$d' \
            > /tmp/p4-007-slice.b64
          base64 --decode /tmp/p4-007-slice.b64 > /tmp/p4-007-slice.tgz
          tar -xzf /tmp/p4-007-slice.tgz
          rm .github/workflows/p4-007-slice-loader.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add NetworkManager backend foundation'
          git push origin HEAD:P4-007_networkmanager_backend
