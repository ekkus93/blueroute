name: Temporary P4-004 incoming-pairing helper

on:
  push:
    branches:
      - P4-004_incoming_pairing
    paths:
      - .github/workflows/p4-004-incoming.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: P4-004_incoming_pairing
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0
      - name: Apply incoming-pairing implementation
        run: |
          python .github/p4-004-incoming.py
          python .github/p4-004-incoming-fix.py
          python .github/p4-004-debug-fix.py
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Commit product changes and remove helper
        run: |
          rm .github/p4-004-incoming.py .github/p4-004-incoming-fix.py .github/p4-004-debug-fix.py .github/workflows/p4-004-incoming.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: add Rust-controlled incoming pairing window"
          git push origin HEAD:P4-004_incoming_pairing
