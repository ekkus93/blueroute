name: P4-008 TODO progress

on:
  push:
    branches:
      - P4-008_route_adapter
    paths:
      - .github/workflows/p4-008-todo-stage.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-008_route_adapter
      - name: Record P4-008 implementation progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/TODO.md')
          text = path.read_text()
          p4_007 = '| P4-007 | `[x]` | Direct NetworkManager system-D-Bus backend, bounded state observation, explicit ownership, BlueRoute-owned bridge/address lifecycle, fail-closed cross-owner handling, and real Debian 13 hardware acceptance are complete. |'
          p4_008 = '| P4-008 | `[-]` | NetworkManager route inspection/add-update-remove, ownership enforcement, and fresh-backend route reconciliation are implemented and tested; live kernel route hardware acceptance is pending. |'
          if p4_008 not in text:
              if text.count(p4_007) != 1:
                  raise SystemExit('expected exactly one P4-007 status row')
              text = text.replace(p4_007, p4_007 + '\n' + p4_008, 1)
          old = '''## P4-008 — Implement route adapter

          - [ ] inspect routes.
          - [ ] add/update/remove BlueRoute routes.
          - [ ] ownership identification.
          - [ ] reconcile after backend restart.

          **Acceptance**

          - Repeated application is idempotent and foreign routes are preserved.'''
          new = '''## P4-008 — Implement route adapter

          - [x] inspect routes.
          - [x] add/update/remove BlueRoute routes.
          - [x] ownership identification.
          - [x] reconcile after backend restart.

          **Acceptance**

          - Repeated application is idempotent and foreign routes are preserved.
          - Implementation/design notes and the live route probe are documented in `docs/P4-008-ROUTES.md`.
          - Physical NetworkManager/kernel route acceptance and foreign-route preservation evidence are still pending; keep P4-008 `[-]` until that evidence is recorded.'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one incomplete P4-008 block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TODO.md
          git diff --cached --check
          git commit -m 'docs: record P4-008 implementation progress'
          git push origin HEAD:P4-008_route_adapter
