name: Temporary P4-005 PANU timeout validation

on:
  push:
    branches:
      - P4-005_panu_timeout_hardening

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: P4-005_panu_timeout_hardening
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0

      - name: Apply timeout hardening
        run: python3 .github/p4-005-timeout.py

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Commit product changes and remove helper
        run: |
          rm .github/p4-005-timeout.py .github/workflows/p4-005-timeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/blueroute-linux/src/pan.rs docs/P4-005-PANU.md docs/TODO.md .github
          git commit -m "fix: bound and cancel PANU connection attempts"
          git push origin HEAD:P4-005_panu_timeout_hardening
