name: Temporary P3-005 TODO sync

on:
  push:
    branches:
      - P3-005_secure_persistent_secrets

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Synchronize TODO
        run: python3 .github/p3-005-todo.py

      - name: Commit TODO and remove helpers
        shell: bash
        run: |
          git rm .github/p3-005-todo.py .github/workflows/p3-005-todo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO.md
          git commit -m "docs: mark P3-005 complete"
          git push
