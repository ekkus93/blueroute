name: P4-007 address-data fix

on:
  push:
    branches:
      - P4-007_networkmanager_backend
    paths:
      - .github/workflows/p4-007-address-data-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-007_networkmanager_backend
      - name: Patch NetworkManager address-data compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/blueroute-linux/src/networkmanager.rs')
          text = path.read_text()

          old = '''        let group = settings.entry(family_name.to_owned()).or_default();
        if family_prefixes.is_empty() {'''
          new = '''        let group = settings.entry(family_name.to_owned()).or_default();
        // NetworkManager ignores address-data when the deprecated addresses property is
        // present in the same D-Bus update, even if that legacy array is empty. GetSettings()
        // may return addresses, so remove it before writing the modern representation.
        group.remove("addresses");
        if family_prefixes.is_empty() {'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one set_address_prefixes insertion point, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_test = '''        let v4 = IpPrefix::new(IpAddr::V4(Ipv4Addr::new(10, 42, 0, 2)), 24).unwrap();
        let v6 = IpPrefix::new(IpAddr::V6(Ipv6Addr::LOCALHOST), 128).unwrap();
        set_address_prefixes(&mut settings, &[v4, v6]).unwrap();
        let mut read = address_prefixes(&settings).unwrap();'''
          new_test = '''        let v4 = IpPrefix::new(IpAddr::V4(Ipv4Addr::new(10, 42, 0, 2)), 24).unwrap();
        let v6 = IpPrefix::new(IpAddr::V6(Ipv6Addr::LOCALHOST), 128).unwrap();
        settings
            .get_mut(IPV4_SETTING)
            .unwrap()
            .insert("addresses".to_owned(), OwnedValue::from(true));
        settings
            .get_mut(IPV6_SETTING)
            .unwrap()
            .insert("addresses".to_owned(), OwnedValue::from(true));
        set_address_prefixes(&mut settings, &[v4, v6]).unwrap();
        assert!(!settings.get(IPV4_SETTING).unwrap().contains_key("addresses"));
        assert!(!settings.get(IPV6_SETTING).unwrap().contains_key("addresses"));
        let mut read = address_prefixes(&settings).unwrap();'''
          if text.count(old_test) != 1:
              raise SystemExit(f'expected one address mutation test target, found {text.count(old_test)}')
          text = text.replace(old_test, new_test, 1)

          path.write_text(text)
          PY
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0
          cargo fmt --all
          rm .github/workflows/p4-007-address-data-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: prefer NetworkManager address-data over legacy addresses'
          git push origin HEAD:P4-007_networkmanager_backend
