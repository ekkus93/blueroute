name: Temporary P3-004 TODO sync

on:
  push:
    branches:
      - P3-004_schema_migration_framework

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize TODO
        run: python3 .github/p3-004-todo.py
      - name: Commit TODO and remove helpers
        shell: bash
        run: |
          git rm .github/workflows/p3-004-todo.yml .github/p3-004-todo.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO.md
          git commit -m "docs: mark P3-004 complete"
          git push
