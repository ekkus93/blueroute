name: Temporary P3-003 TODO sync

on:
  push:
    branches:
      - P3-003_network_membership_persistence

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Synchronize P3-003 status
        shell: bash
        run: |
          if ! grep -Fq '| P3-003 |' docs/TODO.md; then
            sed -i '/| P3-002 |/a | P3-003 | `[x]` | Durable known-network and peer membership/trust state persists through restart; forget/cleanup and corruption handling are tested and green in CI. |' docs/TODO.md
          fi
          sed -i 's/^- \[ \] known networks\.$/- [x] known networks./' docs/TODO.md
          sed -i 's/^- \[ \] peer membership\/trust data\.$/- [x] peer membership\/trust data./' docs/TODO.md
          sed -i 's/^- \[ \] cleanup\/forget semantics\.$/- [x] cleanup\/forget semantics./' docs/TODO.md

      - name: Remove helper and commit TODO
        shell: bash
        run: |
          git rm .github/workflows/p3-003-todo-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO.md
          git commit -m "docs: mark P3-003 complete"
          git push
