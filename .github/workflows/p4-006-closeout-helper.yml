name: P4-006 closeout helper

on:
  push:
    branches:
      - P4-006_hardware_acceptance

permissions:
  contents: write

jobs:
  assemble-todo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-006_hardware_acceptance
      - name: Assemble verified TODO and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          cat docs/.p4-006-todo-part-* | base64 --decode > docs/TODO.md
          test "$(git hash-object docs/TODO.md)" = "09c6925c98fe777820acaec3accefe7a58e4076f"
          rm docs/.p4-006-todo-part-*
          rm -f docs/P4-006-COMPLETE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: complete P4-006 acceptance'
          git push origin HEAD:P4-006_hardware_acceptance
