name: Temporary P4-003 validation

on:
  push:
    branches:
      - P4-003_bluetooth_device_discovery

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-003_bluetooth_device_discovery
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0
      - name: Assemble and apply staged implementation
        run: |
          cat .github/p4-003-patch.00 .github/p4-003-patch.01 .github/p4-003-patch.02 .github/p4-003-patch.03 .github/p4-003-patch.04 > /tmp/p4-003.patch.b64
          test "$(sha256sum /tmp/p4-003.patch.b64 | cut -d' ' -f1)" = "bb7530f4b568363a78d86cd3ef0dafc3dee099eb313d650a21371672c1ff8c38"
          base64 --decode /tmp/p4-003.patch.b64 > /tmp/p4-003.patch
          test "$(sha256sum /tmp/p4-003.patch | cut -d' ' -f1)" = "1e27e6416b5036605eeed4ed04c1fac2a918a01753ad8e2d9cce339c06b1ea6d"
          git apply --check /tmp/p4-003.patch
          git apply /tmp/p4-003.patch
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Commit validated implementation
        run: |
          rm .github/p4-003-patch.00 .github/p4-003-patch.01 .github/p4-003-patch.02 .github/p4-003-patch.03 .github/p4-003-patch.04
          rm .github/workflows/p4-003-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement BlueZ device discovery"
          git push origin HEAD:P4-003_bluetooth_device_discovery
