name: P4-009 format

on:
  push:
    branches:
      - P4-009_forwarding_adapter
    paths:
      - .github/workflows/p4-009-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-009_forwarding_adapter
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Format Rust sources
        run: |
          set -euo pipefail
          rustup override set 1.95.0
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/blueroute-linux/src/forwarding.rs crates/blueroute-linux/src/lib.rs crates/blueroute-linux/src/networkmanager.rs
          if git diff --cached --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git commit -m 'style: format P4-009 forwarding adapter'
          git push origin HEAD:P4-009_forwarding_adapter
