name: Temporary P4-004 hardware acceptance sync

on:
  push:
    branches:
      - P4-004_hardware_acceptance

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: P4-004_hardware_acceptance
          fetch-depth: 0

      - name: Update TODO
        run: python .github/p4-004-hardware-acceptance.py

      - name: Remove temporary helper
        run: |
          rm .github/p4-004-hardware-acceptance.py
          rm .github/workflows/p4-004-hardware-acceptance.yml

      - name: Commit acceptance documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: complete P4-004 hardware acceptance"
          git push origin HEAD:P4-004_hardware_acceptance
