name: P4-007 Clippy fixes

on:
  push:
    branches:
      - P4-007_networkmanager_backend
    paths:
      - .github/workflows/p4-007-clippy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-007_networkmanager_backend
          fetch-depth: 2
      - name: Patch Clippy findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/blueroute-linux/src/networkmanager.rs')
          text = path.read_text()
          replacements = [
              (
                  '''    if let Some(device) = device_by_interface(connection, interface).await? {\n        if device.active_connection.as_ref() == Some(&profile.connection.handle) {\n            deactivate_device_connection(connection, &device).await?;\n        }\n    }''',
                  '''    if let Some(device) = device_by_interface(connection, interface).await?\n        && device.active_connection.as_ref() == Some(&profile.connection.handle)\n    {\n        deactivate_device_connection(connection, &device).await?;\n    }''',
              ),
              (
                  '''    if let Some(device) = device_by_interface(connection, interface).await? {\n        if device.active_connection.is_some() {\n            return Err(CoreError::with_diagnostic(\n                ErrorKind::InvalidState,\n                "refusing to take over an already-active foreign NetworkManager interface",\n                format!("interface={}", interface.as_str()),\n            ));\n        }\n    }''',
                  '''    if let Some(device) = device_by_interface(connection, interface).await?\n        && device.active_connection.is_some()\n    {\n        return Err(CoreError::with_diagnostic(\n            ErrorKind::InvalidState,\n            "refusing to take over an already-active foreign NetworkManager interface",\n            format!("interface={}", interface.as_str()),\n        ));\n    }''',
              ),
              (
                  '''        if let Some(device) = device_by_interface(connection, interface).await? {\n            if device\n                .active_connection\n                .as_ref()\n                .map(NetworkConnectionHandle::as_str)\n                == Some(profile_path)\n            {\n                return Ok(());\n            }\n        }''',
                  '''        if let Some(device) = device_by_interface(connection, interface).await?\n            && device\n                .active_connection\n                .as_ref()\n                .map(NetworkConnectionHandle::as_str)\n                == Some(profile_path)\n        {\n            return Ok(());\n        }''',
              ),
              (
                  '    if interface.as_str().as_bytes().len() > 15 {',
                  '    if interface.as_str().len() > 15 {',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one Clippy target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0
          cargo fmt --all
          rm .github/workflows/p4-007-clippy-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: satisfy Clippy for NetworkManager backend'
          git push origin HEAD:P4-007_networkmanager_backend
