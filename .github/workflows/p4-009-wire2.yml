name: P4-009 wire forwarding v2

on:
  push:
    branches:
      - P4-009_forwarding_adapter
    paths:
      - .github/workflows/p4-009-wire2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-009_forwarding_adapter
      - name: Wire forwarding module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/blueroute-linux/src/lib.rs')
          text = lib.read_text()
          old = 'mod bluez;\nmod identity;'
          new = 'mod bluez;\nmod forwarding;\nmod identity;'
          if text.count(old) != 1:
              raise SystemExit(f'expected lib module anchor once, found {text.count(old)}')
          lib.write_text(text.replace(old, new, 1))

          nm = Path('crates/blueroute-linux/src/networkmanager.rs')
          text = nm.read_text()
          start = text.index('    fn set_ipv4_forwarding(')
          marker = '\n    }\n}\n\nstruct NetworkManagerSubscription'
          end = text.index(marker, start) + len('\n    }')
          replacement = "    fn set_ipv4_forwarding(&self, enabled: bool) -> BackendFuture<'_, ()> {\n        Box::pin(async move { crate::forwarding::set_ipv4_forwarding(enabled) })\n    }"
          nm.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/blueroute-linux/src/lib.rs crates/blueroute-linux/src/networkmanager.rs
          git commit -m 'feat: wire kernel IPv4 forwarding adapter'
          git push origin HEAD:P4-009_forwarding_adapter
