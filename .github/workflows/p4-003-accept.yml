name: Temporary P4-003 acceptance sync

on:
  push:
    branches:
      - P4-003_hardware_acceptance

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: P4-003_hardware_acceptance
          fetch-depth: 0
      - name: Synchronize TODO
        run: python .github/p4-003-accept.py
      - name: Remove temporary helpers and commit
        run: |
          rm .github/p4-003-accept.py
          rm .github/workflows/p4-003-accept.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TODO.md .github/p4-003-accept.py .github/workflows/p4-003-accept.yml
          git commit -m "docs: complete P4-003 hardware acceptance"
          git push origin HEAD:P4-003_hardware_acceptance
