name: Temporary P4-006 lifecycle hardening

on:
  push:
    branches: [P4-006_nap_lifecycle]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: P4-006_nap_lifecycle
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0

      - name: Apply lifecycle hardening
        run: python3 .github/p4-006-followup.py

      - name: Format
        run: cargo fmt --all

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Remove temporary helpers
        run: rm .github/p4-006-followup.py .github/workflows/p4-006-followup.yml

      - name: Commit validated hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden NAP lifecycle state'
          git push origin HEAD:P4-006_nap_lifecycle
