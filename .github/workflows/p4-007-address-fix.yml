name: P4-007 address compatibility fix

on:
  push:
    branches: [P4-007_networkmanager_backend]
    paths: [.github/workflows/p4-007-address-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-007_networkmanager_backend
      - name: Apply fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("crates/blueroute-linux/src/networkmanager.rs"); s=p.read_text(); old="        let group = settings.entry(family_name.to_owned()).or_default();\n        if family_prefixes.is_empty() {"; new="        let group = settings.entry(family_name.to_owned()).or_default();\n        // NetworkManager ignores address-data when deprecated addresses is present in the same update.\n        // GetSettings() may return that legacy key, so remove it before writing address-data.\n        group.remove(\"addresses\");\n        if family_prefixes.is_empty() {"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("crates/blueroute-linux/src/networkmanager.rs"); s=p.read_text(); marker="    #[test]\n    fn duplicate_owned_profiles_fail_closed() {"; test="    #[test]\n    fn address_mutation_removes_legacy_addresses_property() {\n        let owner = network(5);\n        let mut settings = base_owned_settings(owner, &interface(\"br-blue0\"), KIND_BRIDGE).unwrap();\n        settings\n            .get_mut(IPV4_SETTING)\n            .unwrap()\n            .insert(\"addresses\".to_owned(), OwnedValue::from(true));\n        let prefix = IpPrefix::new(IpAddr::V4(Ipv4Addr::new(10, 42, 0, 1)), 24).unwrap();\n        set_address_prefixes(&mut settings, &[prefix]).unwrap();\n        assert!(!settings.get(IPV4_SETTING).unwrap().contains_key(\"addresses\"));\n        assert_eq!(address_prefixes(&settings).unwrap(), vec![prefix]);\n    }\n\n"; assert s.count(marker)==1, s.count(marker); p.write_text(s.replace(marker,test+marker,1))'
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0
          cargo fmt --all
          rm .github/workflows/p4-007-address-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: prefer NetworkManager address-data over legacy addresses'
          git push origin HEAD:P4-007_networkmanager_backend
