name: Temporary P4-004 AgentManager path fix

on:
  push:
    branches:
      - P4-004_agent_manager_path_fix
    paths:
      - .github/workflows/p4-004-agent-manager-path-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: P4-004_agent_manager_path_fix
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0
      - name: Apply fix
        run: python .github/p4-004-agent-manager-path-fix.py
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Commit product changes and remove helper
        run: |
          rm .github/p4-004-agent-manager-path-fix.py .github/workflows/p4-004-agent-manager-path-fix.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: use BlueZ AgentManager object path"
          git push origin HEAD:P4-004_agent_manager_path_fix
