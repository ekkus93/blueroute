name: Temporary P3-004 review fix

on:
  push:
    branches:
      - P3-004_schema_migration_framework

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply review fixes
        run: python3 .github/p3-004-review-fix.py

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0

      - name: Run Rust gates
        run: |
          cargo fmt --all
          cargo check --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Commit fixes and remove helpers
        shell: bash
        run: |
          git rm .github/workflows/p3-004-review-fix.yml .github/p3-004-review-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/blueroute-linux/src/membership_store.rs
          git commit -m "test: harden membership migration compatibility"
          git push
