name: P4-008 route update reconciliation

on:
  push:
    branches:
      - P4-008_route_adapter
    paths:
      - .github/workflows/p4-008-route-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-008_route_adapter
      - name: Reconcile route updates by destination
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/blueroute-linux/src/networkmanager.rs')
          text = path.read_text()

          fn = text.index('fn set_route_present(')
          start = text.index('    let mut entries = route_data_entries(settings, family)?;', fn)
          end = text.index('    let group = settings.entry(family.to_owned()).or_default();', start)
          replacement = '''    let mut entries = route_data_entries(settings, family)?;
              let target = (route.destination, route.via, route.metric);
              let mut changed = false;
              let mut found = false;
              let mut kept = Vec::with_capacity(entries.len() + if present { 1 } else { 0 });
              for entry in entries.drain(..) {
                  let key = route_key_from_entry(&entry, ipv4)?;
                  if present && key.0 == route.destination {
                      if key == target && !found {
                          found = true;
                          kept.push(entry);
                      } else {
                          // Destination is the route identity for the current LinuxRoute model.
                          // Reconcile stale next-hop/metric variants instead of accumulating them.
                          changed = true;
                      }
                  } else if !present && key == target {
                      changed = true;
                  } else {
                      kept.push(entry);
                  }
              }
              if present && !found {
                  kept.push(encode_route_entry(route));
                  changed = true;
              }

          '''
          text = text[:start] + replacement + text[end:]

          test_fn = text.index('fn route_mutation_round_trips_is_idempotent_and_preserves_unrelated_routes()')
          start = text.index('        assert!(set_route_present(&mut settings, &second, true).unwrap());', test_fn)
          old_end = '        assert!(!set_route_present(&mut settings, &first, false).unwrap());'
          end = text.index(old_end, start) + len(old_end)
          replacement = '''        assert!(set_route_present(&mut settings, &second, true).unwrap());
                  let entries = route_data_entries(&settings, IPV4_SETTING).unwrap();
                  assert_eq!(entries.len(), 2);

                  let updated = LinuxRoute {
                      destination: first.destination,
                      via: None,
                      interface: first.interface.clone(),
                      metric: 99,
                      owner,
                  };
                  assert!(set_route_present(&mut settings, &updated, true).unwrap());
                  assert!(!set_route_present(&mut settings, &updated, true).unwrap());
                  let entries = route_data_entries(&settings, IPV4_SETTING).unwrap();
                  assert_eq!(entries.len(), 2);
                  let keys: Vec<_> = entries
                      .iter()
                      .map(|entry| route_key_from_entry(entry, true).unwrap())
                      .collect();
                  assert!(keys.contains(&(updated.destination, updated.via, updated.metric)));
                  assert!(keys.contains(&(second.destination, second.via, second.metric)));
                  assert!(!keys.contains(&(first.destination, first.via, first.metric)));

                  assert!(set_route_present(&mut settings, &updated, false).unwrap());
                  let entries = route_data_entries(&settings, IPV4_SETTING).unwrap();
                  assert_eq!(entries.len(), 1);
                  assert_eq!(
                      route_key_from_entry(&entries[0], true).unwrap(),
                      (second.destination, second.via, second.metric)
                  );
                  assert!(!set_route_present(&mut settings, &updated, false).unwrap());'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/blueroute-linux/src/networkmanager.rs
          git diff --cached --check
          git commit -m 'fix: reconcile NetworkManager route updates'
          git push origin HEAD:P4-008_route_adapter
