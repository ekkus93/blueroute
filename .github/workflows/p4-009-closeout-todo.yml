name: P4-009 closeout TODO

on:
  push:
    branches: [P4-009_forwarding_adapter]
    paths: [.github/workflows/p4-009-closeout-todo.yml]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-009_forwarding_adapter
      - name: Mark P4-009 complete
        env:
          SCRIPT_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$SCRIPT_B64" | base64 -d > /tmp/p4-009-closeout.py
          python3 /tmp/p4-009-closeout.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TODO.md
          git commit -m 'docs: mark P4-009 forwarding complete'
          git push origin HEAD:P4-009_forwarding_adapter
