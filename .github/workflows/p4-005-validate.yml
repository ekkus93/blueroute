name: Temporary P4-005 PANU validation

on:
  push:
    branches:
      - P4-005_panu_connection

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: P4-005_panu_connection
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply integration edits
        run: python .github/p4-005-apply.py

      - name: Format
        run: cargo fmt --all

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Commit product changes and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/p4-005-apply.py .github/workflows/p4-005-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement BlueZ PANU connection adapter'
          git push origin HEAD:P4-005_panu_connection
