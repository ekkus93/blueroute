name: Temporary P4-002 bootstrap

on:
  push:
    branches:
      - P4-002_bluez_adapter_discovery

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: P4-002_bluez_adapter_discovery
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0
      - name: Format
        run: cargo fmt --all
      - name: Check workspace and update lockfile
        run: cargo check --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Commit generated lockfile and formatting
        run: |
          rm .github/workflows/p4-002-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: bootstrap P4-002 dependencies"
          git push origin HEAD:P4-002_bluez_adapter_discovery
