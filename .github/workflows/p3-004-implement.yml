name: Temporary P3-004 implementation

on:
  push:
    branches:
      - P3-004_schema_migration_framework

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply implementation patch
        run: python3 .github/p3-004-implement.py

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Select pinned Rust toolchain
        run: rustup override set 1.95.0

      - name: Format
        run: cargo fmt --all

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          git rm .github/workflows/p3-004-implement.yml .github/p3-004-implement.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/blueroute-linux/src/membership_store.rs
          git commit -m "feat: add membership schema migration framework"
          git push
